<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseTech Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050b1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 560px;
            padding: 54px;
            background: #10192e;
            border: 1px solid #30405f;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 74px;
            height: 74px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff315d, #ff7a00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 38px;
        }

        .subtitle {
            color: #91a8d0;
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 19px;
            margin-bottom: 26px;
            border-radius: 13px;
            border: 1px solid #405070;
            background: #070d1d;
            color: white;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #00c8ff;
        }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 13px;
            background: #f5164d;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #ff285b;
        }

        .status {
            text-align: center;
            color: #91a8d0;
            margin-top: 26px;
            font-size: 17px;
        }

        .security {
            border-top: 1px solid #30405f;
            margin-top: 32px;
            padding-top: 28px;
            text-align: center;
            color: #7187ad;
            font-size: 16px;
        }

        .error {
            text-align: center;
            color: #ff3d65;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">⚡</div>

    <h1>PulseTech</h1>

    <p class="subtitle">
        Continuous ICU Clinical Deterioration &amp; Early Intervention Monitor
    </p>

    <form id="loginForm" action="/login" method="POST">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Sign In
        </button>
        <p class="signup-link">
    Don't have an account?
    <a href="/signup">Sign Up</a>
</p>

    </form>

    <p class="status">
        Authorized clinical personnel only
    </p>

    <div class="security">
        🔒 Secure Clinical Monitoring Environment
    </div>

</div>

</body>
</html>
